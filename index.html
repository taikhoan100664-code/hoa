
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoa Hồng Nở Rộ 🌹</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;overflow:hidden;
  background:radial-gradient(ellipse at center,#35102c 0%,#100817 65%,#05030b 100%);
  color:#fff;font-family:Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;
}
.scene{text-align:center;width:100%;padding:15px;position:relative;z-index:2}
h1{
  font-size:clamp(26px,7vw,42px);color:#ff9cce;
  text-shadow:0 0 15px #ff237f,0 0 35px #f06;
  animation:glow 2s infinite alternate;
}
p{color:#ffd6e9;font-size:15px}
.flower{
  position:relative;width:240px;height:300px;
  margin:10px auto 0;
}
.stem{
  position:absolute;width:7px;height:170px;
  background:linear-gradient(90deg,#164b29,#6ad66b,#174324);
  left:117px;top:112px;border-radius:100%;
  transform:rotate(5deg);transform-origin:top;
}
.leaf{
  position:absolute;width:65px;height:28px;
  background:linear-gradient(135deg,#8ae66a,#167331);
  border-radius:100% 0 100% 0;
  box-shadow:0 0 12px #2b9d4c;
}
.leaf.left{top:205px;left:55px;transform:rotate(12deg)}
.leaf.right{top:165px;left:123px;transform:rotate(80deg) scaleX(-1)}
.bloom{
  position:absolute;left:120px;top:100px;
  width:0;height:0;transform:translate(-50%,-50%);
  animation:appear 1s ease-out forwards;
}
.petal{
  position:absolute;left:-35px;top:-58px;
  width:70px;height:100px;
  border-radius:50% 50% 43% 43%;
  transform-origin:50% 90%;
  background:linear-gradient(135deg,#ffb0d0 0%,#fa287b 40%,#a6003e 100%);
  box-shadow:inset 4px 3px 9px #ffc0dd88,0 0 12px #ff267955;
  animation:open 3s cubic-bezier(.2,.8,.2,1) both;
}
.petal.back{
  background:linear-gradient(135deg,#ff9fc9,#dc075a 60%,#70002f);
  height:110px;width:76px;left:-38px;top:-62px;
}
.petal.inner{
  width:47px;height:68px;left:-23px;top:-38px;
  background:linear-gradient(135deg,#ffb6d9,#f51b71 65%,#8c0038);
}
.center{
  position:absolute;left:-15px;top:-18px;
  width:30px;height:37px;border-radius:50%;
  background:linear-gradient(120deg,#ffb4d6,#c5004e);
  box-shadow:0 0 15px #ff5b9e;
}
@keyframes open{
  0%{transform:rotate(var(--a)) scale(.08) translateY(20px)}
  70%{transform:rotate(var(--a)) scale(1.08)}
  100%{transform:rotate(var(--a)) scale(1)}
}
@keyframes appear{
  from{filter:brightness(.2);transform:translate(-50%,-50%) scale(.1)}
  to{filter:brightness(1);transform:translate(-50%,-50%) scale(1)}
}
@keyframes glow{
  from{text-shadow:0 0 10px #ff237f}
  to{text-shadow:0 0 25px #ff237f,0 0 45px #ff6ca9}
}
button{
  border:1px solid #ff8fbd;border-radius:30px;
  background:linear-gradient(135deg,#ff4f96,#bd0754);
  color:white;padding:13px 24px;font-size:16px;
  box-shadow:0 0 20px #ff267766;cursor:pointer;
  margin:12px 5px;
}
button:active{transform:scale(.95)}
#message{min-height:28px;color:#ffb5d4;font-size:16px}
.spark{
  position:fixed;pointer-events:none;color:#ffc2df;
  animation:fall linear forwards;z-index:1;
}
@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0deg);opacity:0}
  10%{opacity:1}
  100%{transform:translateY(110vh) rotate(500deg);opacity:0}
}
</style>
</head>
<body>
<div class="scene">
  <h1>🌹 Hoa Hồng Nở Rộ 🌹</h1>
  <p>Một đóa hồng dành tặng bạn</p>

  <div class="flower">
    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>
    <div class="bloom" id="bloom"></div>
  </div>

  <div id="message">Chạm vào nút để hoa nở rực rỡ hơn nhé!</div>
  <button onclick="bloomAgain()">🌹 Làm hoa nở rộ</button>
  <button onclick="changeMessage()">💌 Lời nhắn</button>
</div>

<script>
const bloom=document.getElementById('bloom');
const colors=[
 ['#ffb0d0','#fa287b','#a6003e'],
 ['#ffd1e5','#ff477e','#b50043'],
 ['#ffb2ad','#fa374d','#a90028']
];
let flowerColor=0;

function makeFlower(){
  bloom.innerHTML='';
  const c=colors[flowerColor];
  for(let i=0;i<12;i++){
    const p=document.createElement('div');
    p.className='petal back';
    p.style.setProperty('--a',(i*30)+'deg');
    p.style.transform=`rotate(${i*30}deg)`;
    p.style.background=`linear-gradient(135deg,${c[0]},${c[1]} 55%,${c[2]})`;
    p.style.animationDelay=(i*.06)+'s';
    bloom.appendChild(p);
  }
  for(let i=0;i<9;i++){
    const p=document.createElement('div');
    p.className='petal';
    p.style.setProperty('--a',(i*40)+'deg');
    p.style.transform=`rotate(${i*40}deg)`;
    p.style.animationDelay=(.3+i*.07)+'s';
    bloom.appendChild(p);
  }
  for(let i=0;i<6;i++){
    const p=document.createElement('div');
    p.className='petal inner';
    p.style.setProperty('--a',(i*60)+'deg');
    p.style.transform=`rotate(${i*60}deg)`;
    p.style.animationDelay=(.7+i*.08)+'s';
    bloom.appendChild(p);
  }
  const center=document.createElement('div');
  center.className='center';
  bloom.appendChild(center);
}
function bloomAgain(){
  flowerColor=(flowerColor+1)%colors.length;
  makeFlower();
  document.getElementById('message').textContent='Hoa đã nở rực rỡ! 🌹';
  for(let i=0;i<25;i++)setTimeout(makeSpark,i*45);
}
const messages=[
  'Chúc bạn luôn xinh đẹp và hạnh phúc ❤️',
  'Mong mỗi ngày của bạn đều rực rỡ như hoa 🌹',
  'Gửi bạn một đóa hồng cùng thật nhiều yêu thương 💗',
  'Hãy luôn nở rộ theo cách riêng của mình ✨'
];
let mi=0;
function changeMessage(){
  document.getElementById('message').textContent=messages[mi%messages.length];
  mi++;
}
function makeSpark(){
  const s=document.createElement('div');
  s.className='spark';
  s.textContent=['🌸','💗','✨','🌹'][Math.floor(Math.random()*4)];
  s.style.left=Math.random()*100+'vw';
  s.style.top='-5vh';
  s.style.fontSize=(12+Math.random()*20)+'px';
  s.style.animationDuration=(4+Math.random()*5)+'s';
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),9000);
}
makeFlower();
setInterval(()=>{if(Math.random()>.4)makeSpark()},600);
</script>
</body>
</html>
